<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SubnetIQ — IPv4 Subnet Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090C10;
      --card: #121720;
      --card-inner: #0D1117;
      --border: #212836;
      --border-focus: #3B82F6;
      --text: #F3F4F6;
      --text-muted: #8B949E;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-col: column;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Header */
    header {
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .brand-icon {
      background: var(--accent);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Inputs */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    .input-row {
      display: flex;
      gap: 12px;
    }
    input[type="text"], select {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    input[type="text"].invalid {
      border-color: var(--error);
    }

    /* Range Slider */
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }
    .slider-label {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 26px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid #fff;
    }

    /* Message / Status */
    #ip-msg {
      font-size: 12px;
      margin-top: 6px;
      min-height: 18px;
    }

    /* Results List */
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .result-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .result-label {
      color: var(--text-muted);
    }
    .result-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: transparent;
      color: var(--text);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    .btn-outline {
      border-color: var(--border);
      background: var(--card-inner);
    }
    .btn-outline:hover:not(:disabled) {
      border-color: var(--text-muted);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .action-bar {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    /* ISP Box */
    #isp-box {
      margin-top: 14px;
      padding: 12px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.6;
    }
    .isp-line {
      display: flex;
      justify-content: space-between;
    }
    .isp-link {
      color: var(--accent);
      text-decoration: none;
    }
    .isp-link:hover {
      text-decoration: underline;
    }

    /* All Subnets Table */
    #all-wrap {
      margin-top: 18px;
    }
    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 280px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th {
      background: var(--card-inner);
      color: var(--text-muted);
      font-weight: 500;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr.active-row {
      background: rgba(59, 130, 246, 0.12);
    }
    tr.active-row td {
      color: var(--accent);
      font-weight: 600;
    }

    /* Footer */
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 540px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover {
      color: var(--text);
    }
    pre.cli-output {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      overflow-x: auto;
      max-height: 200px;
      margin: 14px 0;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .card {
        padding: 16px;
      }
      .input-row {
        flex-direction: column;
      }
      .result-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-icon">/IQ</span>
      <h1>SubnetIQ</h1>
    </div>
    <p>Clean &amp; simple IPv4 subnet calculator with MikroTik CLI generator.</p>
  </header>

  <!-- Input Section -->
  <section class="card">
    <div class="card-title">Configuration</div>
    
    <div class="form-group">
      <label for="ip">IPv4 Address</label>
      <input id="ip" type="text" value="192.168.1.50" placeholder="192.168.1.1" autocomplete="off" spellcheck="false" class="mono">
      <div id="ip-msg"></div>
    </div>

    <div class="form-group">
      <label for="mask">Subnet Mask / CIDR</label>
      <select id="mask" class="mono"></select>
      <div class="slider-wrap">
        <span class="slider-label mono">/1</span>
        <input id="cidr" type="range" min="1" max="32" value="24" aria-label="CIDR slider">
        <span class="slider-label mono" style="text-align: right;">/32</span>
      </div>
    </div>

    <!-- ISP Box (Shown for public IPs) -->
    <div id="isp-box" class="hidden"></div>
  </section>

  <!-- Results Section -->
  <section class="card">
    <div class="card-title">
      <span>Results</span>
      <span id="type-badge" class="mono" style="font-size: 11px; text-transform: none; color: var(--success);"></span>
    </div>

    <div id="results"></div>

    <div class="action-bar">
      <button id="export-btn" type="button" class="btn btn-outline">MikroTik CLI</button>
      <button id="copy-btn" type="button" class="btn btn-primary">Copy Results</button>
    </div>
  </section>

  <!-- All Subnets in Block -->
  <section id="all-wrap" class="card hidden">
    <div class="card-title">
      <span id="all-title">Subnets in Block</span>
    </div>
    <div class="table-container">
      <table id="all-table"></table>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    SubnetIQ &bull; Handcrafted by Md Jahid Hasan Emon &bull; 2026
  </footer>

</div>

<!-- MikroTik Modal -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Generate MikroTik CLI</h2>
      <button id="modal-close-x" class="close-btn">&times;</button>
    </div>

    <div class="form-group">
      <label for="m-name">Pool Name</label>
      <input id="m-name" type="text" class="mono" placeholder="LAN_Pool" value="LAN_Pool">
    </div>

    <div class="form-group">
      <label for="m-range">Select Range</label>
      <select id="m-range" class="mono"></select>
    </div>

    <pre id="m-cli" class="cli-output"></pre>

    <div class="action-bar">
      <button id="modal-close-btn" class="btn btn-outline">Close</button>
      <button id="m-copy-btn" class="btn btn-primary">Copy Script</button>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const ipEl = $('ip'), cidrEl = $('cidr'), maskEl = $('mask');
  const msgEl = $('ip-msg'), resultsEl = $('results'), typeBadge = $('type-badge');
  const copyBtn = $('copy-btn'), exportBtn = $('export-btn');
  const ispBox = $('isp-box');
  const allWrap = $('all-wrap'), allTitle = $('all-title'), allTable = $('all-table');

  const toInt = (o) => (((o[0] << 24) | (o[1] << 16) | (o[2] << 8) | o[3]) >>> 0);
  const toDotted = (n) => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
  const maskFor = (c) => (c === 0 ? 0 : (0xFFFFFFFF << (32 - c)) >>> 0);
  const fmt = (n) => n.toLocaleString('en-US');

  // Populate mask select
  for (let c = 1; c <= 32; c++) {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = `/${c}  –  ${toDotted(maskFor(c))}`;
    maskEl.appendChild(opt);
  }
  maskEl.value = 24;

  function parseIp(raw) {
    const v = raw.trim();
    if (!v) return { ok: false, msg: 'Enter an IPv4 address (e.g. 192.168.1.1)' };
    if (/[^0-9.]/.test(v)) return { ok: false, msg: 'Only numbers and dots allowed' };
    const parts = v.split('.');
    if (parts.length !== 4) return { ok: false, msg: 'Must contain exactly 4 octets' };
    for (let i = 0; i < 4; i++) {
      const p = parts[i];
      if (p === '' || isNaN(p)) return { ok: false, msg: 'Invalid format' };
      if (p.length > 1 && p[0] === '0') return { ok: false, msg: `Remove leading zero in "${p}"` };
      const num = parseInt(p, 10);
      if (num < 0 || num > 255) return { ok: false, msg: `Octet "${p}" must be 0–255` };
    }
    return { ok: true, octets: parts.map(Number) };
  }

  function ipClass(first) {
    if (first < 128) return 'A';
    if (first < 192) return 'B';
    if (first < 224) return 'C';
    if (first < 240) return 'D';
    return 'E';
  }

  function ipType(o) {
    const a = o[0], b = o[1];
    if (a === 127) return 'Loopback';
    if (a === 169 && b === 254) return 'Link-local';
    if (a >= 224 && a <= 239) return 'Multicast';
    if (a === 10 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168)) return 'Private (RFC 1918)';
    if (a === 100 && b >= 64 && b <= 127) return 'CGNAT';
    if (a === 0) return 'Reserved';
    if (a >= 240) return 'Reserved';
    return 'Public';
  }

  function compute(octets, cidr) {
    const ip = toInt(octets);
    const mask = maskFor(cidr);
    const wild = (~mask) >>> 0;
    const net = (ip & mask) >>> 0;
    const bc = (net | wild) >>> 0;
    let first, last, hosts;
    if (cidr === 32) { first = last = net; hosts = 1; }
    else if (cidr === 31) { first = net; last = bc; hosts = 2; }
    else { first = net + 1; last = bc - 1; hosts = Math.pow(2, 32 - cidr) - 2; }

    const cls = ipClass(octets[0]);
    const type = ipType(octets);

    return {
      net: toDotted(net),
      bc: toDotted(bc),
      first: toDotted(first),
      last: toDotted(last),
      hosts: hosts,
      mask: toDotted(mask),
      wild: toDotted(wild),
      cls: cls,
      type: type,
      items: [
        ['Network Address', toDotted(net)],
        ['Broadcast Address', toDotted(bc)],
        ['Usable Range', `${toDotted(first)}  –  ${toDotted(last)}`],
        ['Usable Hosts', fmt(hosts)],
        ['Subnet Mask', `${toDotted(mask)}  (/ ${cidr})`],
        ['Wildcard Mask', toDotted(wild)],
        ['IP Class', `Class ${cls}`],
        ['Address Type', type]
      ]
    };
  }

  let current = null;
  let allNets = [];

  function update() {
    const cidr = parseInt(cidrEl.value, 10);
    maskEl.value = cidr;

    const parsed = parseIp(ipEl.value);
    if (!parsed.ok) {
      ipEl.classList.add('invalid');
      msgEl.style.color = 'var(--error)';
      msgEl.textContent = parsed.msg;
      typeBadge.textContent = '';
      copyBtn.disabled = true;
      exportBtn.disabled = true;
      resultsEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">Enter a valid IP address to calculate.</div>';
      allWrap.classList.add('hidden');
      ispBox.classList.add('hidden');
      current = null;
      return;
    }

    ipEl.classList.remove('invalid');
    msgEl.style.color = 'var(--success)';
    msgEl.textContent = 'Valid IPv4 Address';
    copyBtn.disabled = false;
    exportBtn.disabled = false;

    const out = compute(parsed.octets, cidr);
    current = { ip: parsed.octets.join('.'), cidr, items: out.items, net: out.net, first: out.first, last: out.last, hosts: out.hosts };

    typeBadge.textContent = out.type;
    typeBadge.style.color = out.type.includes('Private') ? 'var(--success)' : (out.type === 'Public' ? 'var(--warning)' : 'var(--text-muted)');

    // Render results
    resultsEl.innerHTML = out.items.map(([label, val]) => `
      <div class="result-row">
        <span class="result-label">${label}</span>
        <span class="result-val">${val}</span>
      </div>
    `).join('');

    renderAll(parsed.octets, cidr);
    ispLookup(out.type === 'Public' ? parsed.octets.join('.') : null);
  }

  function renderAll(o, cidr) {
    const pb = Math.floor((cidr - 1) / 8) * 8;
    const count = Math.pow(2, cidr - pb);
    const size = Math.pow(2, 32 - cidr);
    const ipn = toInt(o);
    const base = (ipn & maskFor(pb)) >>> 0;
    const pat = [0, 1, 2, 3].map((i) => (i < pb / 8 ? o[i] : '*')).join('.');

    allTitle.textContent = `All /${cidr} Subnets in ${pat}`;
    allNets = [];

    let rows = '';
    for (let i = 0; i < count; i++) {
      const net = base + i * size, bc = net + size - 1;
      let first = net + 1, last = bc - 1, pool = `${toDotted(first + 1)}-${toDotted(last)}`;
      if (cidr === 32) { first = last = net; pool = ''; }
      else if (cidr === 31) { first = net; last = bc; pool = ''; }

      const hit = ipn >= net && ipn <= bc;
      allNets.push({ net: toDotted(net), cidr, first: toDotted(first), last: toDotted(last), bc: toDotted(bc), pool, hit });

      rows += `
        <tr class="${hit ? 'active-row' : ''}">
          <td>${toDotted(net)}/${cidr}</td>
          <td>${toDotted(first)} – ${toDotted(last)}</td>
          <td>${toDotted(bc)}</td>
        </tr>`;
    }

    allTable.innerHTML = `
      <thead>
        <tr>
          <th>Subnet</th>
          <th>Usable Range</th>
          <th>Broadcast</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>`;
    allWrap.classList.remove('hidden');
  }

  // ISP Lookup
  let ispTimer = null;
  function ispLookup(ip) {
    if (!ip) {
      clearTimeout(ispTimer);
      ispBox.classList.add('hidden');
      return;
    }
    ispBox.innerHTML = '<span style="color:var(--text-muted);">Fetching ISP info...</span>';
    ispBox.classList.remove('hidden');

    clearTimeout(ispTimer);
    ispTimer = setTimeout(async () => {
      try {
        const res = await fetch(`https://ipwho.is/${encodeURIComponent(ip)}`);
        const d = await res.json();
        if (d && d.success !== false) {
          const org = d.connection?.isp || d.connection?.org || 'Unknown';
          const asn = d.connection?.asn ? `AS${d.connection.asn}` : 'N/A';
          const loc = [d.city, d.country].filter(Boolean).join(', ');
          ispBox.innerHTML = `
            <div class="isp-line"><span>ISP / Org:</span> <strong>${org}</strong></div>
            <div class="isp-line"><span>ASN &amp; Location:</span> <span>${asn} &bull; ${loc}</span></div>
            <div class="isp-line" style="margin-top:4px;"><a href="https://bgp.he.net/ip/${ip}" target="_blank" class="isp-link">View BGP details on bgp.he.net &rarr;</a></div>
          `;
          return;
        }
      } catch (e) {}
      ispBox.innerHTML = `<span>ISP data unavailable.</span> <a href="https://bgp.he.net/ip/${ip}" target="_blank" class="isp-link">Check bgp.he.net</a>`;
    }, 400);
  }

  // Copy
  function copyText(str, btn, normalTxt) {
    navigator.clipboard.writeText(str).then(() => {
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = normalTxt; }, 1500);
    });
  }

  copyBtn.addEventListener('click', () => {
    if (!current) return;
    const txt = current.items.map(([k, v]) => `${k}: ${v}`).join('\n');
    copyText(txt, copyBtn, 'Copy Results');
  });

  // Modal
  const modal = $('modal'), mName = $('m-name'), mRange = $('m-range'), mCli = $('m-cli'), mCopyBtn = $('m-copy-btn');

  function renderCli() {
    const name = mName.value.trim() || 'LAN_Pool';
    const sel = allNets[parseInt(mRange.value, 10)];
    if (!sel || !sel.pool) {
      mCli.textContent = '# No pool available for this prefix size';
      return;
    }
    mCli.textContent = `/ip pool\nadd name=${name} ranges=${sel.pool}\n\n/ip dhcp-server network\nadd address=${sel.net}/${sel.cidr} gateway=${sel.first}`;
  }

  exportBtn.addEventListener('click', () => {
    mRange.innerHTML = '';
    allNets.forEach((n, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.selected = n.hit;
      opt.textContent = `${n.net}/${n.cidr} ${n.pool ? `(Pool: ${n.pool})` : ''}`;
      mRange.appendChild(opt);
    });
    renderCli();
    modal.classList.remove('hidden');
  });

  $('modal-close-x').addEventListener('click', () => modal.classList.add('hidden'));
  $('modal-close-btn').addEventListener('click', () => modal.classList.add('hidden'));
  mName.addEventListener('input', renderCli);
  mRange.addEventListener('change', renderCli);
  mCopyBtn.addEventListener('click', () => copyText(mCli.textContent, mCopyBtn, 'Copy Script'));

  // Inputs
  ipEl.addEventListener('input', update);
  cidrEl.addEventListener('input', update);
  maskEl.addEventListener('change', () => { cidrEl.value = maskEl.value; update(); });

  update();
})();
